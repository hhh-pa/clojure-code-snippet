name: clojure-snippets

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Test data (recipes superproject resource/shared) ships as an encrypted
# bundle, tests/resources.tar.xz.asc (tar.xz, AES-256, ASCII-armored).
# The passphrase lives in the RESOURCES_PASSPHRASE repository secret.
# To rotate: run tools/build_bundle.sh with a fresh passphrase and set
# the secret to the same value (see the script header).

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Clojure jars
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Run Clojure snippet tests
        run: python3 tests/run_tests.py --resources tests/resources --jobs 4 --timeout 300

  perf:
    needs: test
    runs-on: ubuntu-latest
    # contents:read for checkout; checks:write so Bencher can post its report
    # check; pull-requests:write so it can post its PR comment on PR runs.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      matrix:
        include:
          # One entry per compiler/runtime. Benchmark names stay identical
          # across runtimes; Bencher compares them via testbeds, so overlay
          # the testbeds on the perf page for visual comparison.
          - runtime: jvm
            testbed: ubuntu-latest-jvm
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Clojure jars
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Install measurement tools
        run: |
          sudo apt-get update
          sudo apt-get install -y time
          sudo apt-get install -y linux-tools-common linux-tools-generic || \
            echo "perf unavailable; instructions/cycles will be null"

      - name: Measure performance (load-independent metrics)
        run: |
          python3 tools/measure.py --resources tests/resources \
            --repeat 3 --jobs 2 --timeout 300 \
            --runtime ${{ matrix.runtime }} \
            --output perf-results.json --bmf-output bencher-bmf.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ matrix.runtime }}
          path: |
            perf-results.json
            bencher-bmf.json

      - name: Install Bencher CLI
        uses: bencherdev/bencher@main

      - name: Track benchmarks with Bencher
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bencher run \
              --project hhh-pa \
              --key '${{ secrets.BENCHER_API_KEY }}' \
              --branch "${{ github.head_ref }}" \
              --hash "${{ github.event.pull_request.head.sha }}" \
              --start-point "${{ github.base_ref }}" \
              --start-point-hash "${{ github.event.pull_request.base.sha }}" \
              --start-point-clone-thresholds \
              --testbed ${{ matrix.testbed }} \
              --adapter json \
              --file bencher-bmf.json \
              --github-actions "${{ secrets.GITHUB_TOKEN }}"
          else
            bencher run \
              --project hhh-pa \
              --key '${{ secrets.BENCHER_API_KEY }}' \
              --branch "${{ github.ref_name }}" \
              --testbed ${{ matrix.testbed }} \
              --threshold-measure peak_memory \
              --threshold-test t_test \
              --threshold-max-sample-size 64 \
              --threshold-upper-boundary 0.99 \
              --adapter json \
              --file bencher-bmf.json \
              --github-actions "${{ secrets.GITHUB_TOKEN }}"
          fi
