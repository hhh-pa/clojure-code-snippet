name: clojure-snippets

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Test data (recipes superproject resource/shared) ships as an encrypted
# bundle, tests/resources.tar.xz.asc (tar.xz, AES-256, ASCII-armored).
# The passphrase lives in the RESOURCES_PASSPHRASE repository secret.
# To rotate: run tools/build_bundle.sh with a fresh passphrase and set
# the secret to the same value (see the script header).

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Clojure jars
        id: jars-cache
        uses: actions/cache@v4
        with:
          path: .ci/jars
          key: clojure-jars-1.12.0-spec0.5.238-core0.4.74-v1

      - name: Download Clojure jars
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Run Clojure snippet tests
        run: python3 tests/run_tests.py --resources tests/resources --jobs 4 --timeout 300

  perf:
    needs: test
    runs-on: ubuntu-latest
    # checks:write so each shard can post its own Bencher report check
    # (and PR comment); per-shard reports keep every check under
    # GitHub's ~64KB summary limit at 3 measures (T19).
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      # Let every shard finish so partial artifacts upload for diagnosis.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        include:
          # One entry per compiler/runtime. Benchmark names stay identical
          # across runtimes; Bencher compares them via testbeds, so overlay
          # the testbeds on the perf page for visual comparison.
          # Keep in sync with the report job's runtime matrix below.
          - runtime: jvm
            testbed: ubuntu-latest-jvm
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Clojure jars
        id: jars-cache
        uses: actions/cache@v4
        with:
          path: .ci/jars
          key: clojure-jars-1.12.0-spec0.5.238-core0.4.74-v1

      - name: Download Clojure jars
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Install measurement tools
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: time linux-tools-common linux-tools-generic
          version: 1.0

      - name: Measure performance (load-independent metrics)
        run: |
          python3 tools/measure.py --resources tests/resources \
            --repeat 3 --jobs 2 --timeout 300 \
            --runtime ${{ matrix.runtime }} \
            --shard ${{ matrix.shard }}/4 \
            --output perf-results.json --bmf-output bencher-bmf.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Install Bencher CLI
        uses: bencherdev/bencher@main

      # Threshold policy: peak_memory (t_test) only, by design.
      # cpu_time is too noisy on shared runners to threshold, and
      # allocated_bytes is an informational trend like cpu_time, so
      # Bencher's residual No-Threshold boilerplate for those
      # measures is expected and not actionable. min-sample-size 10:
      # the t_test needs history to calibrate maxrss variance (both
      # master false positives so far fired on tiny samples).
      # Each shard reports its own BMF subset (same project,
      # testbed, branch, and benchmark names, so history stays
      # continuous): one merged 37-benchmark x 3-measure report
      # would exceed GitHub's ~64KB check-summary limit again (T11),
      # while per-shard reports (~10 benchmarks x 3 measures) fit
      # with headroom for a 4th measure.
      - name: Track benchmarks with Bencher
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bencher run \
              --project clojure-code-snippet \
              --key '${{ secrets.BENCHER_API_KEY }}' \
              --branch "${{ github.head_ref }}" \
              --hash "${{ github.event.pull_request.head.sha }}" \
              --start-point "${{ github.base_ref }}" \
              --start-point-hash "${{ github.event.pull_request.base.sha }}" \
              --start-point-clone-thresholds \
              --testbed ${{ matrix.testbed }} \
              --adapter json \
              --file bencher-bmf.json \
              --github-actions "${{ secrets.GITHUB_TOKEN }}"
          else
            bencher run \
              --project clojure-code-snippet \
              --key '${{ secrets.BENCHER_API_KEY }}' \
              --branch "${{ github.ref_name }}" \
              --testbed ${{ matrix.testbed }} \
              --threshold-measure peak_memory \
              --threshold-test t_test \
              --threshold-min-sample-size 10 \
              --threshold-max-sample-size 64 \
              --threshold-upper-boundary 0.99 \
              --adapter json \
              --file bencher-bmf.json \
              --github-actions "${{ secrets.GITHUB_TOKEN }}"
          fi

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ matrix.runtime }}-shard-${{ matrix.shard }}
          path: |
            perf-results.json
            bencher-bmf.json

  report:
    needs: perf
    runs-on: ubuntu-latest
    # No Bencher run here by design: reporting the merged 37-benchmark
    # x 3-measure file would re-truncate the check summary (T11).
    # This job only merges artifacts and appends the combined table
    # to its step summary (per-shard summaries stay in the perf jobs).
    permissions:
      contents: read
    # One merge per runtime; keep in sync with the perf job's matrix above.
    strategy:
      matrix:
        include:
          - runtime: jvm
    steps:
      - uses: actions/checkout@v4

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: perf-results-${{ matrix.runtime }}-shard-*

      - name: Merge shard reports
        run: |
          python3 tools/measure.py --merge perf-results-*/perf-results.json \
            --output perf-results-merged.json \
            --bmf-output bencher-bmf-merged.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # The merge must equal the plain BMF union: sharding is
      # snippet-cohesive, so no benchmark straddles two shards.
      - name: Verify merge matches per-shard BMFs
        run: |
          jq -s 'add' perf-results-*/bencher-bmf.json > bencher-bmf-jq.json
          diff <(jq -S . bencher-bmf-merged.json) <(jq -S . bencher-bmf-jq.json)

      - name: Upload merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ matrix.runtime }}-merged
          path: |
            perf-results-merged.json
            bencher-bmf-merged.json
