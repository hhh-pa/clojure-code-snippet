name: clojure-snippets

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      clojure_rs_sha:
        description: 'Pin clojure-rs to this revision instead of master HEAD (40-char SHA; empty = float)'
        required: false
        default: ''

# One run per branch: a new push supersedes the previous commit's run
# (stale sweeps cancel instead of burning ~6h each). Master keeps every
# run (no cancel) so no landed commit loses its Bencher perf record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Test data (recipes superproject resource/shared) ships as an encrypted
# bundle, tests/resources.tar.xz.asc (tar.xz, AES-256, ASCII-armored).
# The passphrase lives in the RESOURCES_PASSPHRASE organization secret,
# shared by the clojure/python/ocaml snippet repos (one passphrase,
# identical bundles). To rotate: run `snip bundle` with a fresh
# passphrase, set the organization secret to the same value, and
# rebuild the sibling bundles too (see `snip bundle --help`).

# The perf-instrumentation native leg always builds clojure-rs master HEAD
# (interpreter-only build; `run` needs no LLVM), resolved once per
# run by the resolve-rs job below. A bad upstream commit fails
# loudly (the sweep diff-gates every case), and Bencher shows the
# delta; to bisect or repro, dispatch manually with `clojure_rs_sha`.

jobs:
  # Resolve the clojure-rs revision ONCE per run so all 16 sweep
  # legs build the same commit even if upstream master moves
  # mid-sweep (a ~6h window). Default: master HEAD (float); a
  # manual dispatch may pin `clojure_rs_sha` instead.
  resolve-rs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.clojure_rs_sha }}" ]; then
            sha="${{ inputs.clojure_rs_sha }}"
            echo "using dispatch-pinned revision"
          else
            sha=$(git ls-remote https://github.com/hhh-pa/clojure HEAD | awk '{print $1}')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "error: resolved clojure-rs revision is not a 40-char SHA: '$sha'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "clojure-rs revision: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
  test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/snip-tools
        with:
          cache-key: snip-${{ runner.os }}-${{ hashFiles('.github/actions/snip-tools/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/snip/**', 'scripts/ci/go/internal/snipcore/**', 'scripts/ci/go/internal/mtrand/**', 'scripts/ci/go/internal/pyjson/**', 'scripts/ci/go/internal/cljread/**', 'scripts/ci/go/internal/aot/**', 'scripts/ci/go/internal/generators/**', 'scripts/ci/go/internal/slope/**', 'scripts/ci/go/internal/measure/**', 'scripts/ci/go/internal/bundle/**') }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.13'

      - name: Cache Clojure jars
        id: jars-cache
        uses: actions/cache@v5
        with:
          path: .ci/jars
          key: clojure-jars-1.12.0-spec0.5.238-core0.4.74-v1

      - name: Download Clojure jars
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Run Clojure snippet tests
        run: '"$GITHUB_WORKSPACE/snip-bin/snip" test --resources tests/resources --jobs 4 --timeout 300 --shard ${{ matrix.shard }}/4'

      - name: Run SSA DF regression test
        run: '"$GITHUB_WORKSPACE/snip-bin/snip" ssa'

  # Aggregator: branch policy requires a check literally named "test",
  # which the sharded matrix above no longer produces on its own.
  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards green
        run: |
          if [ "${{ needs.test-shard.result }}" = "success" ]; then exit 0; else exit 1; fi

  # Full-matrix instrumentation sweep: every snippet's deterministic
  # measures (callgrind_instructions + callgrind_allocated_bytes,
  # plus pin_instructions + pin_allocated_bytes) on every push, for
  # JVM Clojure and clojure-rs alike. This is the only perf signal
  # (the timed perf job was removed in T1211).
  # Lean recipe (--repeat 1, --no-alloc since the instrument phases
  # themselves yield allocation, no slope): ~21s/case all-in on CI
  # hardware x ~220 cases/shard / 2 jobs ~= 40min per shard
  # (callgrind-only baseline; the pin phase adds its own share).
  # A valgrind/Pin/toolchain failure fails the push (unlike the
  # pilot): the sweep is a required signal.
  perf-instrumentation:
    needs: [test, resolve-rs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      # Let every shard finish so partial artifacts upload for diagnosis.
      fail-fast: false
      matrix:
        # One entry per compiler/runtime; benchmark names stay
        # identical across runtimes (Bencher compares via testbeds,
        # derived below as ubuntu-latest-<runtime>). Keep the
        # runtime list in sync with the report-instrumentation job below.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        runtime: [jvm, clojure-rs]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/snip-tools
        with:
          cache-key: snip-${{ runner.os }}-${{ hashFiles('.github/actions/snip-tools/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/snip/**', 'scripts/ci/go/internal/snipcore/**', 'scripts/ci/go/internal/mtrand/**', 'scripts/ci/go/internal/pyjson/**', 'scripts/ci/go/internal/cljread/**', 'scripts/ci/go/internal/aot/**', 'scripts/ci/go/internal/generators/**', 'scripts/ci/go/internal/slope/**', 'scripts/ci/go/internal/measure/**', 'scripts/ci/go/internal/bundle/**') }}
      - id: pin
        uses: ./.github/actions/pin-tools
        with:
          cache-key: pin-${{ runner.os }}-${{ hashFiles('.github/actions/pin-tools/**', 'scripts/ci/pin/**') }}

      - name: Set up JDK 21
        if: matrix.runtime == 'jvm'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.13'

      - name: Cache Clojure jars
        if: matrix.runtime == 'jvm'
        id: jars-cache
        uses: actions/cache@v5
        with:
          path: .ci/jars
          key: clojure-jars-1.12.0-spec0.5.238-core0.4.74-v1

      - name: Download Clojure jars
        if: matrix.runtime == 'jvm' && steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      # clojure-rs leg: interpreter-only release build (no LLVM:
      # `run` needs just the interpreter crates). The revision is
      # master HEAD resolved once per run (see resolve-rs); the
      # sweep diff-gates every case, so a bad upstream commit fails
      # loudly, and Bencher shows the perf delta. The built binary is
      # cached by resolved SHA: repeat runs on the same upstream
      # revision skip checkout + toolchain + build on all 8 legs.
      - name: Restore cached clojure-rs binary
        id: cljrs-bin-cache
        if: matrix.runtime == 'clojure-rs'
        uses: actions/cache@v5
        with:
          path: cljrs-bin
          key: cljrs-bin-${{ runner.os }}-${{ needs.resolve-rs.outputs.sha }}

      - name: Install Rust toolchain
        if: matrix.runtime == 'clojure-rs' && steps.cljrs-bin-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Check out clojure-rs
        if: matrix.runtime == 'clojure-rs' && steps.cljrs-bin-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: hhh-pa/clojure
          ref: ${{ needs.resolve-rs.outputs.sha }}
          path: clojure-rs

      - name: Cache cargo build
        if: matrix.runtime == 'clojure-rs' && steps.cljrs-bin-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clojure-rs/rust

      - name: Build clojure-rs
        if: matrix.runtime == 'clojure-rs' && steps.cljrs-bin-cache.outputs.cache-hit != 'true'
        run: |
          cd clojure-rs/rust
          cargo build --release --locked --no-default-features
          mkdir -p "$GITHUB_WORKSPACE/cljrs-bin"
          cp target/release/clojure-rs "$GITHUB_WORKSPACE/cljrs-bin/"
          echo "${{ needs.resolve-rs.outputs.sha }}" > "$GITHUB_WORKSPACE/cljrs-bin/.rev"

      # Runs on hit AND miss (the build step above only runs on miss):
      # the .rev marker proves the cached binary was built from the
      # resolved revision — a mismatch fails loudly instead of
      # benchmarking the wrong commit.
      - name: Use clojure-rs binary
        if: matrix.runtime == 'clojure-rs'
        run: |
          test "$(cat cljrs-bin/.rev)" = "${{ needs.resolve-rs.outputs.sha }}"
          echo "$GITHUB_WORKSPACE/cljrs-bin" >> "$GITHUB_PATH"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Install measurement tools
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          # gcc builds snip's LD_PRELOAD allocation-counting shim
          # on demand (native legs); g++ and make build the Pin
          # inscount tool on pin-kit cache miss. All three are
          # preinstalled on the hosted image, listed here so the
          # dependencies are explicit.
          packages: time linux-tools-common linux-tools-generic valgrind gcc g++ make
          version: 1.3

      # Valgrind gate: the apt cache key embeds apt-resolved
      # package versions, which differ across runner image
      # builds (run 41713792243: linux-tools 7.0.0-38.38 on
      # image 20261025 vs 7.0.0-42.42 on 20261101) — and the
      # -38 entry is degenerate ("Restoring 0 packages"), so
      # those legs install green yet get NO valgrind.
      # `snip measure` then only warns and records
      # callgrind_repeat 0: 9 of 16 shards green but vacuous.
      # So probe exactly what snip probes (valgrind on PATH +
      # `valgrind --version` exit 0 within 30s); on failure
      # reinstall once from apt, and fail LOUDLY if valgrind
      # is still unusable — never again a green vacuous shard.
      - name: Verify valgrind usable
        run: |
          usable() { command -v valgrind >/dev/null && timeout 30 valgrind --version >/dev/null 2>&1; }
          if ! usable; then
            echo "cached valgrind unusable; reinstalling from apt"
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --reinstall time linux-tools-common linux-tools-generic valgrind gcc g++ make
          fi
          command -v valgrind
          ver=$(timeout 30 valgrind --version)
          echo "$ver"
          echo "valgrind: $ver" >> "$GITHUB_STEP_SUMMARY"

      - name: Measure instrumentation sweep (deterministic metrics)
        # Lean recipe: one timed run (stdout gate) + the callgrind
        # phase per case (JVM: one -Xint+EpsilonGC run; native: one
        # plain callgrind run plus one LD_PRELOAD counting run) +
        # the Pin phase (one inscount run per case; the pin-tools
        # action above fails loudly when Pin is unusable, so no
        # vacuous pin_instructions here). No --alloc (the instrument
        # phases themselves yield allocation), no --slope (slope fits
        # timed runs).
        run: |
          flags=(--runtime "${{ matrix.runtime }}")
          if [ "${{ matrix.runtime }}" = "clojure-rs" ]; then
            flags+=(--command-template 'clojure-rs run {script}')
          fi
          "$GITHUB_WORKSPACE/snip-bin/snip" measure --resources tests/resources \
            --repeat 1 --no-alloc --jobs 2 --timeout 900 \
            "${flags[@]}" \
            --shard ${{ matrix.shard }}/8 \
            --callgrind --callgrind-repeat 1 \
            --pin --pin-bin "${{ steps.pin.outputs.pin-bin }}" \
            --pin-tool "${{ steps.pin.outputs.pin-tool }}" \
            --pin-repeat 1 --pin-timeout 900 \
            --output sweep-results.json --bmf-output sweep-bmf.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Install Bencher CLI
        uses: bencherdev/bencher@main

      # Threshold policy: callgrind_instructions (percentage) only,
      # same flags on both testbeds (the clojure-rs testbed starts
      # with empty history and arms after 10 samples). Both
      # gungraun-run measures are tracked; the overlapping
      # cpu_time/peak_memory entries are stripped before reporting
      # (the sweep is repeat-1 timing, not a timing signal; no
      # allocated_bytes here: --no-alloc). A fixed 1% upper
      # boundary sits far above the ~0.0006% observed callgrind
      # wobble; min/max sample 10/64. callgrind_allocated_bytes
      # rides threshold-free until its own wobble is characterized.
      # Each shard reports its own stripped subset (~50
      # benchmarks x 2 measures).
      - name: Track callgrind benchmarks with Bencher
        run: |
          jq 'with_entries(select(.value.callgrind_instructions != null and .value.callgrind_allocated_bytes != null) | .value |= {callgrind_instructions, callgrind_allocated_bytes})' \
            sweep-bmf.json > sweep-bench.json
          if [ "$(jq 'length' sweep-bench.json)" = "0" ]; then
            echo "no callgrind data in shard; skipping Bencher report"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bencher run \
              --project clojure-code-snippet \
              --key '${{ secrets.BENCHER_API_KEY }}' \
              --branch "${{ github.head_ref }}" \
              --hash "${{ github.event.pull_request.head.sha }}" \
              --start-point "${{ github.base_ref }}" \
              --start-point-hash "${{ github.event.pull_request.base.sha }}" \
              --start-point-clone-thresholds \
              --testbed ubuntu-latest-${{ matrix.runtime }} \
              --adapter json \
              --file sweep-bench.json \
              --github-actions "${{ secrets.GITHUB_TOKEN }}"
          else
            bencher run \
              --project clojure-code-snippet \
              --key '${{ secrets.BENCHER_API_KEY }}' \
              --branch "${{ github.ref_name }}" \
              --testbed ubuntu-latest-${{ matrix.runtime }} \
              --threshold-measure callgrind_instructions \
              --threshold-test percentage \
              --threshold-min-sample-size 10 \
              --threshold-max-sample-size 64 \
              --threshold-upper-boundary 0.01 \
              --adapter json \
              --file sweep-bench.json \
              --github-actions "${{ secrets.GITHUB_TOKEN }}"
          fi

      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sweep-results-${{ matrix.runtime }}-shard-${{ matrix.shard }}
          path: |
            sweep-results.json
            sweep-bmf.json
            sweep-bench.json

  # AOT pilot: one benchmark per push as a cheap AOT stdout-gate
  # canary (the callgrind half moved to the full-matrix sweep
  # above). continue-on-error: an AOT/JDK toolchain skew on the
  # hosted runner must never fail the push; pilot evidence lands
  # in the uploaded artifacts either way.
  perf-pilot:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/snip-tools
        with:
          cache-key: snip-${{ runner.os }}-${{ hashFiles('.github/actions/snip-tools/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/snip/**', 'scripts/ci/go/internal/snipcore/**', 'scripts/ci/go/internal/mtrand/**', 'scripts/ci/go/internal/pyjson/**', 'scripts/ci/go/internal/cljread/**', 'scripts/ci/go/internal/aot/**', 'scripts/ci/go/internal/generators/**', 'scripts/ci/go/internal/slope/**', 'scripts/ci/go/internal/measure/**', 'scripts/ci/go/internal/bundle/**') }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.13'

      - name: Cache Clojure jars
        id: jars-cache
        uses: actions/cache@v5
        with:
          path: .ci/jars
          key: clojure-jars-1.12.0-spec0.5.238-core0.4.74-v1

      - name: Download Clojure jars
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Install measurement tools
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: time linux-tools-common linux-tools-generic valgrind
          version: 1.1

      - name: Measure AOT pilot
        run: |
          "$GITHUB_WORKSPACE/snip-bin/snip" measure --resources tests/resources \
            --only sort/bubble_sort --aot \
            --repeat 1 --alloc-repeat 1 --jobs 1 --timeout 300 \
            --runtime jvm \
            --output pilot-aot.json --bmf-output pilot-aot-bmf.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-pilot-jvm
          path: |
            pilot-aot.json
            pilot-aot-bmf.json

  report-instrumentation:
    needs: perf-instrumentation
    runs-on: ubuntu-latest
    # No Bencher run here by design: one merged ~394-benchmark
    # file would re-truncate the check summary (T11).
    permissions:
      contents: read
    # One merge per runtime; keep in sync with the perf-instrumentation
    # job's runtime list above.
    strategy:
      matrix:
        runtime: [jvm, clojure-rs]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/snip-tools
        with:
          cache-key: snip-${{ runner.os }}-${{ hashFiles('.github/actions/snip-tools/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/snip/**', 'scripts/ci/go/internal/snipcore/**', 'scripts/ci/go/internal/mtrand/**', 'scripts/ci/go/internal/pyjson/**', 'scripts/ci/go/internal/cljread/**', 'scripts/ci/go/internal/aot/**', 'scripts/ci/go/internal/generators/**', 'scripts/ci/go/internal/slope/**', 'scripts/ci/go/internal/measure/**', 'scripts/ci/go/internal/bundle/**') }}

      - name: Download sweep results
        uses: actions/download-artifact@v8
        with:
          pattern: sweep-results-${{ matrix.runtime }}-shard-*

      - name: Merge sweep reports
        run: |
          "$GITHUB_WORKSPACE/snip-bin/snip" measure --merge sweep-results-*/sweep-results.json \
            --output sweep-results-merged.json \
            --bmf-output sweep-bmf-merged.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # The merge must equal the plain BMF union: sharding is
      # snippet-cohesive, so no benchmark straddles two shards.
      - name: Verify merge matches per-shard BMFs
        run: |
          jq -s 'add' sweep-results-*/sweep-bmf.json > sweep-bmf-jq.json
          diff <(jq -S . sweep-bmf-merged.json) <(jq -S . sweep-bmf-jq.json)

      - name: Upload merged sweep results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sweep-results-${{ matrix.runtime }}-merged
          path: |
            sweep-results-merged.json
            sweep-bmf-merged.json
