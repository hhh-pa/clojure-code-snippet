name: clojure-snippets

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      clojure_rs_sha:
        description: 'Pin clojure-rs to this revision instead of master HEAD (40-char SHA; empty = float)'
        required: false
        default: ''
      instrument:
        description: 'Instrumentation for the sweep (default sweep is timed-only)'
        required: false
        default: none
        type: choice
        options: [none, callgrind, pin, both]
      compare:
        description: 'Performance comparison mode: open PR base/head, else previous commit, vs dispatched HEAD'
        required: false
        default: false
        type: boolean

# One run per branch: a new push supersedes the previous commit's run
# (stale sweeps cancel instead of burning runners for hours each).
# Master keeps every run (no cancel) so no landed commit loses its
# sweep record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Test data (recipes superproject resource/shared) ships as an encrypted
# bundle, tests/resources.tar.xz.asc (tar.xz, AES-256, ASCII-armored).
# The passphrase lives in the RESOURCES_PASSPHRASE organization secret,
# shared by the clojure/python/ocaml snippet repos (one passphrase,
# identical bundles). To rotate: run `snip bundle` with a fresh
# passphrase, set the organization secret to the same value, and
# rebuild the sibling bundles too (see `snip bundle --help`).

# The perf-instrumentation native leg always builds clojure-rs master HEAD
# (interpreter-only build; `run` needs no LLVM), resolved once per
# run by the resolve-rs job below. A bad upstream commit fails
# loudly (the sweep diff-gates every case); to bisect or repro,
# dispatch manually with `clojure_rs_sha`.

jobs:
  # Resolve the clojure-rs revision ONCE per run so all 8 shard
  # jobs build the same commit even if upstream master moves
  # mid-sweep. Default: master HEAD (float); a manual dispatch
  # may pin `clojure_rs_sha` instead.
  resolve-rs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.clojure_rs_sha }}" ]; then
            sha="${{ inputs.clojure_rs_sha }}"
            echo "using dispatch-pinned revision"
          else
            sha=$(git ls-remote https://github.com/hhh-pa/clojure HEAD | awk '{print $1}')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "error: resolved clojure-rs revision is not a 40-char SHA: '$sha'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "clojure-rs revision: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
  # Snippet correctness lives in the sweep below (its timed legs
  # run the same command with the same stdout gate and timeout on
  # both runtimes, so every algorithm must pass for both). This job
  # keeps only the focused SSA DF regression test, which the sweep
  # does not run — and keeps branch policy's `test` context green
  # with no admin change.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/snip-tools
        with:
          cache-key: snip-${{ runner.os }}-${{ hashFiles('.github/actions/snip-tools/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/snip/**', 'scripts/ci/go/internal/snipcore/**', 'scripts/ci/go/internal/mtrand/**', 'scripts/ci/go/internal/pyjson/**', 'scripts/ci/go/internal/cljread/**', 'scripts/ci/go/internal/aot/**', 'scripts/ci/go/internal/generators/**', 'scripts/ci/go/internal/slope/**', 'scripts/ci/go/internal/measure/**', 'scripts/ci/go/internal/bundle/**') }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.13'

      - name: Cache Clojure jars
        id: jars-cache
        uses: actions/cache@v5
        with:
          path: .ci/jars
          key: clojure-jars-1.12.0-spec0.5.238-core0.4.74-v1

      - name: Download Clojure jars
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Run SSA DF regression test
        run: '"$GITHUB_WORKSPACE/snip-bin/snip" ssa'

  # Full-matrix sweep: every snippet's timed stats (cpu/wall time,
  # peak RSS, perf counters) for JVM Clojure and clojure-rs alike —
  # and the snippet-correctness gate (each timed leg diff-gates
  # stdout exactly like `snip test`: same command, same normalize,
  # same 300s timeout, missing resources fail; every algorithm
  # must pass for both runtimes).
  # Pushes and PRs run the single-run mode: this tree only,
  # timed-only, both runtimes sequentially on the SAME runner per
  # shard — same hardware, same resources — with a step proving
  # both legs measured exactly the same cases.
  # A manual dispatch may instead tick `compare`: each shard job
  # then measures a from-tree and a to-tree (open PR base/head,
  # else previous commit vs dispatched HEAD) for both runtimes,
  # and the report job matches the merged reports case by case
  # (missing correspondence yields missing stats, never an error).
  # Dispatches may also add instrumentation via the `instrument`
  # input (callgrind and/or Pin) in either mode.
  # One job per shard (8 jobs). Stats land in the per-shard
  # artifacts and the summary tables; nothing reports to Bencher
  # (repeat-1 timing is not a threshold signal).
  # Lean recipe (--repeat 1, --no-alloc, no slope).
  # A toolchain failure fails the push (unlike the pilot): the
  # sweep is a required signal.
  perf-instrumentation:
    needs: [test, resolve-rs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      # Let every shard finish so partial artifacts upload for diagnosis.
      fail-fast: false
      matrix:
        # Shard index only: both runtime legs (jvm, clojure-rs)
        # run inside each shard job on the same runner (see the
        # measure step). Benchmark names stay identical across
        # runtimes. Keep the leg list in sync with the
        # report-instrumentation job's runtime matrix below.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # Comparison mode needs history locally (worktree below);
      # everything else stays shallow and fast. The '0'/'1' are
      # strings on purpose: the number 0 is falsy, which would
      # flip the || branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.compare && '0' || '1' }}
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/snip-tools
        with:
          cache-key: snip-${{ runner.os }}-${{ hashFiles('.github/actions/snip-tools/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/snip/**', 'scripts/ci/go/internal/snipcore/**', 'scripts/ci/go/internal/mtrand/**', 'scripts/ci/go/internal/pyjson/**', 'scripts/ci/go/internal/cljread/**', 'scripts/ci/go/internal/aot/**', 'scripts/ci/go/internal/generators/**', 'scripts/ci/go/internal/slope/**', 'scripts/ci/go/internal/measure/**', 'scripts/ci/go/internal/bundle/**') }}
      # Pin kit + inscount tool, only for instrumented dispatches
      # (default sweep is timed-only and skips this entirely).
      - id: pin
        if: inputs.instrument == 'pin' || inputs.instrument == 'both'
        uses: ./.github/actions/pin-tools
        with:
          cache-key: pin-${{ runner.os }}-${{ hashFiles('.github/actions/pin-tools/**', 'scripts/ci/pin/**') }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.13'

      - name: Cache Clojure jars
        id: jars-cache
        uses: actions/cache@v5
        with:
          path: .ci/jars
          key: clojure-jars-1.12.0-spec0.5.238-core0.4.74-v1

      - name: Download Clojure jars
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      # clojure-rs leg: interpreter-only release build (no LLVM:
      # `run` needs just the interpreter crates). The revision is
      # master HEAD resolved once per run (see resolve-rs); the
      # sweep diff-gates every case, so a bad upstream commit fails
      # loudly. The built binary is
      # cached by resolved SHA: repeat runs on the same upstream
      # revision skip checkout + toolchain + build on all 8 shard jobs.
      - name: Restore cached clojure-rs binary
        id: cljrs-bin-cache
        uses: actions/cache@v5
        with:
          path: cljrs-bin
          key: cljrs-bin-${{ runner.os }}-${{ needs.resolve-rs.outputs.sha }}

      - name: Install Rust toolchain
        if: steps.cljrs-bin-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Check out clojure-rs
        if: steps.cljrs-bin-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: hhh-pa/clojure
          ref: ${{ needs.resolve-rs.outputs.sha }}
          path: clojure-rs

      - name: Cache cargo build
        if: steps.cljrs-bin-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clojure-rs/rust

      - name: Build clojure-rs
        if: steps.cljrs-bin-cache.outputs.cache-hit != 'true'
        run: |
          cd clojure-rs/rust
          cargo build --release --locked --no-default-features
          mkdir -p "$GITHUB_WORKSPACE/cljrs-bin"
          cp target/release/clojure-rs "$GITHUB_WORKSPACE/cljrs-bin/"
          echo "${{ needs.resolve-rs.outputs.sha }}" > "$GITHUB_WORKSPACE/cljrs-bin/.rev"

      # Runs on hit AND miss (the build step above only runs on miss):
      # the .rev marker proves the cached binary was built from the
      # resolved revision — a mismatch fails loudly instead of
      # benchmarking the wrong commit.
      - name: Use clojure-rs binary
        run: |
          test "$(cat cljrs-bin/.rev)" = "${{ needs.resolve-rs.outputs.sha }}"
          echo "$GITHUB_WORKSPACE/cljrs-bin" >> "$GITHUB_PATH"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Install measurement tools
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          # Timed-only base set: GNU time plus perf. The
          # instrument-only packages (valgrind, gcc for the
          # native-leg counting shim, g++/make for the Pin tool
          # build) install in the conditional step below, so the
          # default sweep never pays for them.
          packages: time linux-tools-common linux-tools-generic
          version: 1.4

      # Instrumented dispatches only: direct apt install, no
      # cache — manual runs are rare, and a fresh install
      # sidesteps the stale-cache failure mode below entirely.
      - name: Install instrument dependencies
        if: inputs.instrument == 'callgrind' || inputs.instrument == 'pin' || inputs.instrument == 'both'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y valgrind gcc g++ make

      # Valgrind gate (callgrind dispatches only): the apt cache
      # key embeds apt-resolved package versions, which differ
      # across runner image builds (run 41713792243: linux-tools
      # 7.0.0-38.38 on image 20261025 vs 7.0.0-42.42 on
      # 20261101) — and the -38 entry is degenerate ("Restoring 0
      # packages"), so those legs install green yet get NO
      # valgrind. `snip measure` then only warns and records
      # callgrind_repeat 0: 9 of 16 shards green but vacuous.
      # So probe exactly what snip probes (valgrind on PATH +
      # `valgrind --version` exit 0 within 30s); on failure
      # reinstall once from apt, and fail LOUDLY if valgrind
      # is still unusable — never again a green vacuous shard.
      - name: Verify valgrind usable
        if: inputs.instrument == 'callgrind' || inputs.instrument == 'both'
        run: |
          usable() { command -v valgrind >/dev/null && timeout 30 valgrind --version >/dev/null 2>&1; }
          if ! usable; then
            echo "cached valgrind unusable; reinstalling from apt"
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --reinstall time linux-tools-common linux-tools-generic valgrind gcc g++ make
          fi
          command -v valgrind
          ver=$(timeout 30 valgrind --version)
          echo "$ver"
          echo "valgrind: $ver" >> "$GITHUB_STEP_SUMMARY"

      # Comparison mode (manual dispatch with `compare`): resolve
      # the from/to commits and check the from-tree out as a
      # worktree. If the dispatched branch heads an open PR, from
      # is that PR's base SHA; otherwise from is the previous
      # commit — to is always the dispatched HEAD. The base SHA
      # may not be local (it lives on another branch), so it is
      # fetched on demand; anything still missing fails loudly.
      - name: Resolve comparison refs
        id: refs
        if: github.event_name == 'workflow_dispatch' && inputs.compare
        run: |
          ensure_present() {
            if ! git cat-file -e "$1" 2>/dev/null; then
              echo "$2 $1 not local; fetching from origin"
              git fetch --no-tags --depth=1 origin "$1" || true
            fi
            if ! git cat-file -e "$1" 2>/dev/null; then
              echo "error: $2 ref '$1' is not available" >&2
              exit 1
            fi
          }
          branch="${{ github.ref_name }}"
          to="$(git rev-parse HEAD)"
          pr="$(gh pr list --head "$branch" --state open --limit 1 --json number,baseRefOid)" \
            || { echo "error: PR lookup for branch $branch failed" >&2; exit 1; }
          if [ "$(echo "$pr" | jq 'length')" = "1" ]; then
            from="$(echo "$pr" | jq -r '.[0].baseRefOid')"
            echo "branch $branch heads PR #$(echo "$pr" | jq -r '.[0].number'); comparing its base -> HEAD"
          else
            if ! from="$(git rev-parse "$to~1" 2>/dev/null)"; then
              echo "error: no open PR for $branch and $to has no parent to compare against" >&2
              exit 1
            fi
            echo "no open PR for $branch; comparing previous commit -> HEAD"
          fi
          ensure_present "$from" "from"
          if [ "$from" = "$to" ]; then
            echo "error: from and to are the same commit ($from); nothing to compare" >&2
            exit 1
          fi
          git worktree add --detach /tmp/sweep-from "$from"
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          printf '{"from":"%s","to":"%s"}\n' "$from" "$to" > sweep-refs.json
          echo "comparing \`$from\` -> \`$to\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Measure sweep (single run)
        if: github.event_name != 'workflow_dispatch' || !inputs.compare
        # Lean recipe per leg: one timed run per case (stdout gate
        # plus cpu/wall time, peak RSS, perf counters). No --alloc,
        # no --slope (slope fits timed runs).
        # Both legs run here on this same runner, sequentially:
        # same hardware, same checkout, same resources — so the JVM
        # vs clojure-rs numbers are apples-to-apples per shard.
        # The next step proves both legs measured exactly the same
        # (label, stem, case) set.
        # Instrumentation is opt-in per dispatch (`instrument`
        # input: callgrind and/or Pin add their phases per case;
        # the setup steps above fail loudly when the instrument is
        # unusable, so no vacuous counts here).
        run: |
          common=(--resources tests/resources
            --repeat 1 --no-alloc --jobs 2 --timeout 300
            --shard ${{ matrix.shard }}/8)
          if [ "${{ inputs.instrument }}" = "callgrind" ] || [ "${{ inputs.instrument }}" = "both" ]; then
            common+=(--callgrind --callgrind-repeat 1)
          fi
          if [ "${{ inputs.instrument }}" = "pin" ] || [ "${{ inputs.instrument }}" = "both" ]; then
            common+=(--pin --pin-bin "${{ steps.pin.outputs.pin-bin }}"
              --pin-tool "${{ steps.pin.outputs.pin-tool }}"
              --pin-repeat 1 --pin-timeout 900)
          fi
          "$GITHUB_WORKSPACE/snip-bin/snip" measure "${common[@]}" \
            --runtime jvm \
            --output sweep-results-jvm.json --bmf-output sweep-bmf-jvm.json \
            --summary-file "$GITHUB_STEP_SUMMARY"
          "$GITHUB_WORKSPACE/snip-bin/snip" measure "${common[@]}" \
            --runtime clojure-rs --command-template 'clojure-rs run {script}' \
            --output sweep-results-clojure-rs.json --bmf-output sweep-bmf-clojure-rs.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Measure sweep (comparison)
        if: github.event_name == 'workflow_dispatch' && inputs.compare
        # Four legs on this same runner: to-tree (workspace
        # checkout) and from-tree (worktree above) crossed with
        # both runtimes. One harness build measures both trees,
        # with the same resources, jars, and clojure-rs binary —
        # only the snippets differ. Timed-only unless the dispatch
        # also sets `instrument` (same flags as the single run).
        run: |
          SNIP="$GITHUB_WORKSPACE/snip-bin/snip"
          OUT="$GITHUB_WORKSPACE"
          RES="$GITHUB_WORKSPACE/tests/resources"
          CP=$(ls "$GITHUB_WORKSPACE/.ci/jars/"*.jar | sort | tr '\n' ':' | sed 's/:$//')
          SHARD="${{ matrix.shard }}/8"
          extra=()
          if [ "${{ inputs.instrument }}" = "callgrind" ] || [ "${{ inputs.instrument }}" = "both" ]; then
            extra+=(--callgrind --callgrind-repeat 1)
          fi
          if [ "${{ inputs.instrument }}" = "pin" ] || [ "${{ inputs.instrument }}" = "both" ]; then
            extra+=(--pin --pin-bin "${{ steps.pin.outputs.pin-bin }}"
              --pin-tool "${{ steps.pin.outputs.pin-tool }}"
              --pin-repeat 1 --pin-timeout 900)
          fi
          "$SNIP" measure --resources tests/resources \
            --repeat 1 --no-alloc --jobs 2 --timeout 300 \
            --shard "$SHARD" "${extra[@]}" \
            --runtime jvm \
            --output sweep-results-to-jvm.json --bmf-output sweep-bmf-to-jvm.json \
            --summary-file "$GITHUB_STEP_SUMMARY"
          "$SNIP" measure --resources tests/resources \
            --repeat 1 --no-alloc --jobs 2 --timeout 300 \
            --shard "$SHARD" "${extra[@]}" \
            --runtime clojure-rs --command-template 'clojure-rs run {script}' \
            --output sweep-results-to-clojure-rs.json --bmf-output sweep-bmf-to-clojure-rs.json \
            --summary-file "$GITHUB_STEP_SUMMARY"
          (cd /tmp/sweep-from && "$SNIP" measure --resources "$RES" --cp "$CP" \
            --repeat 1 --no-alloc --jobs 2 --timeout 300 \
            --shard "$SHARD" "${extra[@]}" \
            --runtime jvm \
            --output "$OUT/sweep-results-from-jvm.json" --bmf-output "$OUT/sweep-bmf-from-jvm.json" \
            --summary-file "$GITHUB_STEP_SUMMARY")
          (cd /tmp/sweep-from && "$SNIP" measure --resources "$RES" --cp "$CP" \
            --repeat 1 --no-alloc --jobs 2 --timeout 300 \
            --shard "$SHARD" "${extra[@]}" \
            --runtime clojure-rs --command-template 'clojure-rs run {script}' \
            --output "$OUT/sweep-results-from-clojure-rs.json" --bmf-output "$OUT/sweep-bmf-from-clojure-rs.json" \
            --summary-file "$GITHUB_STEP_SUMMARY")

      # Within one tree, shard membership must be
      # runtime-independent: discovery + SelectShard see the same
      # checkout, resources, and flags on both runtime legs, so
      # any drift here means a real bug (e.g. a
      # runtime-dependent skip) — fail loudly. Across trees,
      # correspondence is matched tolerantly by snip compare
      # (missing stats, never an error).
      - name: Verify legs measured the same shard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.compare }}" = "true" ]; then
            pairs="from-jvm:from-clojure-rs to-jvm:to-clojure-rs"
          else
            pairs="jvm:clojure-rs"
          fi
          for pair in $pairs; do
            a="${pair%%:*}"; b="${pair##*:}"
            for leg in "$a" "$b"; do
              jq -c '[.results[] | [.label, .stem, .case]] | sort' "sweep-results-$leg.json" > "keys-$leg.json"
              jq -c '(.missing // []) | sort' "sweep-results-$leg.json" > "missing-$leg.json"
            done
            diff "keys-$a.json" "keys-$b.json" || { echo "error: shard ${{ matrix.shard }} measured different cases on $a vs $b" >&2; exit 1; }
            diff "missing-$a.json" "missing-$b.json" || { echo "error: shard ${{ matrix.shard }} has different missing sets on $a vs $b" >&2; exit 1; }
            echo "shard ${{ matrix.shard }}: $(jq 'length' "keys-$a.json") cases identical on $a vs $b"
          done

      # No Bencher reporting: repeat-1 timing is not a threshold
      # signal. Stats live in these artifacts and the merged
      # tables below.
      # Dispatch artifacts keep the per-runtime scheme; comparison
      # artifacts add the from/to role. The report job downloads
      # by event below.
      - name: Upload sweep results (jvm)
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.compare)
        uses: actions/upload-artifact@v7
        with:
          name: sweep-results-jvm-shard-${{ matrix.shard }}
          path: |
            sweep-results-jvm.json
            sweep-bmf-jvm.json

      - name: Upload sweep results (clojure-rs)
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.compare)
        uses: actions/upload-artifact@v7
        with:
          name: sweep-results-clojure-rs-shard-${{ matrix.shard }}
          path: |
            sweep-results-clojure-rs.json
            sweep-bmf-clojure-rs.json

      - name: Upload sweep results (from-jvm)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.compare
        uses: actions/upload-artifact@v7
        with:
          name: sweep-results-from-jvm-shard-${{ matrix.shard }}
          path: |
            sweep-results-from-jvm.json
            sweep-bmf-from-jvm.json
            sweep-refs.json

      - name: Upload sweep results (from-clojure-rs)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.compare
        uses: actions/upload-artifact@v7
        with:
          name: sweep-results-from-clojure-rs-shard-${{ matrix.shard }}
          path: |
            sweep-results-from-clojure-rs.json
            sweep-bmf-from-clojure-rs.json
            sweep-refs.json

      - name: Upload sweep results (to-jvm)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.compare
        uses: actions/upload-artifact@v7
        with:
          name: sweep-results-to-jvm-shard-${{ matrix.shard }}
          path: |
            sweep-results-to-jvm.json
            sweep-bmf-to-jvm.json
            sweep-refs.json

      - name: Upload sweep results (to-clojure-rs)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.compare
        uses: actions/upload-artifact@v7
        with:
          name: sweep-results-to-clojure-rs-shard-${{ matrix.shard }}
          path: |
            sweep-results-to-clojure-rs.json
            sweep-bmf-to-clojure-rs.json
            sweep-refs.json

  # AOT pilot: one benchmark per push as a cheap AOT stdout-gate
  # canary (the callgrind half moved to the full-matrix sweep
  # above). continue-on-error: an AOT/JDK toolchain skew on the
  # hosted runner must never fail the push; pilot evidence lands
  # in the uploaded artifacts either way.
  perf-pilot:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/snip-tools
        with:
          cache-key: snip-${{ runner.os }}-${{ hashFiles('.github/actions/snip-tools/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/snip/**', 'scripts/ci/go/internal/snipcore/**', 'scripts/ci/go/internal/mtrand/**', 'scripts/ci/go/internal/pyjson/**', 'scripts/ci/go/internal/cljread/**', 'scripts/ci/go/internal/aot/**', 'scripts/ci/go/internal/generators/**', 'scripts/ci/go/internal/slope/**', 'scripts/ci/go/internal/measure/**', 'scripts/ci/go/internal/bundle/**') }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.13'

      - name: Cache Clojure jars
        id: jars-cache
        uses: actions/cache@v5
        with:
          path: .ci/jars
          key: clojure-jars-1.12.0-spec0.5.238-core0.4.74-v1

      - name: Download Clojure jars
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Install measurement tools
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: time linux-tools-common linux-tools-generic valgrind
          version: 1.1

      - name: Measure AOT pilot
        run: |
          "$GITHUB_WORKSPACE/snip-bin/snip" measure --resources tests/resources \
            --only sort/bubble_sort --aot \
            --repeat 1 --alloc-repeat 1 --jobs 1 --timeout 300 \
            --runtime jvm \
            --output pilot-aot.json --bmf-output pilot-aot-bmf.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-pilot-jvm
          path: |
            pilot-aot.json
            pilot-aot-bmf.json

  report-instrumentation:
    needs: perf-instrumentation
    runs-on: ubuntu-latest
    # No Bencher anywhere in the sweep (see above): the merged
    # tables and bundles in this job are the stats record.
    permissions:
      contents: read
    # One merge per runtime; keep in sync with the runtime legs
    # in the perf-instrumentation measure step above.
    strategy:
      matrix:
        runtime: [jvm, clojure-rs]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}
      - uses: ./.github/actions/snip-tools
        with:
          cache-key: snip-${{ runner.os }}-${{ hashFiles('.github/actions/snip-tools/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/snip/**', 'scripts/ci/go/internal/snipcore/**', 'scripts/ci/go/internal/mtrand/**', 'scripts/ci/go/internal/pyjson/**', 'scripts/ci/go/internal/cljread/**', 'scripts/ci/go/internal/aot/**', 'scripts/ci/go/internal/generators/**', 'scripts/ci/go/internal/slope/**', 'scripts/ci/go/internal/measure/**', 'scripts/ci/go/internal/bundle/**') }}

      - name: Download sweep results (single run)
        if: github.event_name != 'workflow_dispatch' || !inputs.compare
        uses: actions/download-artifact@v8
        with:
          pattern: sweep-results-${{ matrix.runtime }}-shard-*

      - name: Download sweep results (comparison)
        if: github.event_name == 'workflow_dispatch' && inputs.compare
        uses: actions/download-artifact@v8
        with:
          pattern: sweep-results-*-${{ matrix.runtime }}-shard-*

      - name: Merge sweep reports (single run)
        if: github.event_name != 'workflow_dispatch' || !inputs.compare
        run: |
          "$GITHUB_WORKSPACE/snip-bin/snip" measure --merge sweep-results-*/sweep-results-${{ matrix.runtime }}.json \
            --output sweep-results-merged.json \
            --bmf-output sweep-bmf-merged.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # The merge must equal the plain BMF union: sharding is
      # snippet-cohesive, so no benchmark straddles two shards.
      - name: Verify merge matches per-shard BMFs
        if: github.event_name != 'workflow_dispatch' || !inputs.compare
        run: |
          jq -s 'add' sweep-results-*/sweep-bmf-${{ matrix.runtime }}.json > sweep-bmf-jq.json
          diff <(jq -S . sweep-bmf-merged.json) <(jq -S . sweep-bmf-jq.json)

      - name: Merge sweep reports (comparison)
        if: github.event_name == 'workflow_dispatch' && inputs.compare
        run: |
          SNIP="$GITHUB_WORKSPACE/snip-bin/snip"
          for side in from to; do
            # Unquoted glob: --merge takes shell-expanded paths.
            "$SNIP" measure --merge sweep-results-*/sweep-results-$side-${{ matrix.runtime }}.json \
              --output "sweep-results-$side-merged.json" \
              --bmf-output "sweep-bmf-$side-merged.json" \
              --summary-file "$GITHUB_STEP_SUMMARY"
            jq -s 'add' sweep-results-*/sweep-bmf-$side-${{ matrix.runtime }}.json > "sweep-bmf-$side-jq.json"
            diff <(jq -S . "sweep-bmf-$side-merged.json") <(jq -S . "sweep-bmf-$side-jq.json")
          done

      # Report-only: missing correspondence yields missing stats,
      # never an error. Labels come from the sweep's refs sidecar
      # (any shard's copy; all are identical).
      - name: Compare from/to reports
        if: github.event_name == 'workflow_dispatch' && inputs.compare
        run: |
          refs=$(ls sweep-results-*/sweep-refs.json | head -n 1)
          from="$(jq -r .from "$refs")"; to="$(jq -r .to "$refs")"
          "$GITHUB_WORKSPACE/snip-bin/snip" compare \
            --from sweep-results-from-merged.json --to sweep-results-to-merged.json \
            --from-label "${from:0:7}" --to-label "${to:0:7}" \
            --output sweep-compare-${{ matrix.runtime }}.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload merged sweep results
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.compare)
        uses: actions/upload-artifact@v7
        with:
          name: sweep-results-${{ matrix.runtime }}-merged
          path: |
            sweep-results-merged.json
            sweep-bmf-merged.json

      - name: Upload comparison results
        if: always() && github.event_name == 'workflow_dispatch' && inputs.compare
        uses: actions/upload-artifact@v7
        with:
          name: sweep-results-${{ matrix.runtime }}-merged
          path: |
            sweep-results-from-merged.json
            sweep-bmf-from-merged.json
            sweep-results-to-merged.json
            sweep-bmf-to-merged.json
            sweep-compare-${{ matrix.runtime }}.json
