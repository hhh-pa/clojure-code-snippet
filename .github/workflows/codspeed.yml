name: CodSpeed

on:
  push:
    branches: [master]
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

# Benchmarks are defined in codspeed.yml and run end to end with the
# CodSpeed CLI (walltime instrument). Inputs come from the deterministic
# slope generators (bench/codspeed_bench.py), so no secret is needed.
#
# CodSpeed macro runners are not available to this repository yet, so the
# job uses a GitHub-hosted runner (higher walltime variance). Once they are
# enabled for the organization (and public repositories are allowed in the
# runner group), switch `runs-on` to `codspeed-macro`. See
# https://codspeed.io/docs/integrations/ci/github-actions/macro-runners

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Clojure jars
        id: jars-cache
        uses: actions/cache@v4
        with:
          path: .ci/jars
          key: clojure-jars-1.12.0-spec0.5.238-core0.4.74-v1

      - name: Download Clojure jars
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci/jars
          base=https://repo1.maven.org/maven2
          curl -fsSL -o .ci/jars/clojure.jar "$base/org/clojure/clojure/1.12.0/clojure-1.12.0.jar"
          curl -fsSL -o .ci/jars/spec.alpha.jar "$base/org/clojure/spec.alpha/0.5.238/spec.alpha-0.5.238.jar"
          curl -fsSL -o .ci/jars/core.specs.alpha.jar "$base/org/clojure/core.specs.alpha/0.4.74/core.specs.alpha-0.4.74.jar"

      - name: Generate benchmark inputs
        run: python3 bench/codspeed_bench.py prepare

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
